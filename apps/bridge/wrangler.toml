name = "terminalinobru-bridge"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# Il Worker intercetta sempre le rotte API e quelle del modulo e-commerce di Easyfatt;
# tutto il resto viene servito come asset statico della PWA compilata.
[assets]
directory = "../pwa/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/easyfatt/*"]

[[d1_databases]]
binding = "DB"
database_name = "terminalinobru"
database_id = "da-compilare-al-primo-deploy"
migrations_dir = "migrations"

# Ambiente di produzione. Il worker si chiama "terminalinobru" (senza suffisso "-bridge")
# perché è l'unico worker del progetto esposto in produzione. Bindings e asset non si
# ereditano dalla sezione sopra: vanno ripetuti qui, come vuole Wrangler per gli ambienti
# con nome. L'id del database D1 è in chiaro: non è un segreto (senza il token API non
# permette nulla) e serve sia al deploy fatto da Cloudflare collegando la repo, sia a
# `wrangler d1 migrations apply DB --remote --env produzione` dal PC (decisione 49).
[env.produzione]
name = "terminalinobru"

[env.produzione.assets]
directory = "../pwa/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/easyfatt/*"]

[[env.produzione.d1_databases]]
binding = "DB"
database_name = "terminalinobru"
database_id = "beb7315e-ba2e-41c4-9589-51d798bdf3b4"
migrations_dir = "migrations"
