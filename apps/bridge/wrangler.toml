name = "terminalinobru-bridge"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# Il Worker intercetta sempre le rotte API e quelle del modulo e-commerce di Easyfatt;
# tutto il resto viene servito come asset statico della PWA compilata.
[assets]
directory = "../pwa/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/easyfatt/*"]

[[d1_databases]]
binding = "DB"
database_name = "terminalinobru"
database_id = "da-compilare-al-primo-deploy"
migrations_dir = "migrations"
