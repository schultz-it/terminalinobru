name: Deploy

on:
  push:
    branches: [main]
  # Avvio manuale dalla scheda Actions: serve al primo deploy, dopo aver impostato i secret.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-produzione
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Imposta l'id del database D1 di produzione
        run: |
          sed -i "s/__D1_DATABASE_ID_PRODUZIONE__/${D1_DATABASE_ID}/" apps/bridge/wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Applica le migrazioni D1 di produzione
        run: pnpm --filter bridge exec wrangler d1 migrations apply DB --remote --env produzione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy su Cloudflare
        run: pnpm --filter bridge exec wrangler deploy --env produzione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
