name: Deploy

# Il deploy di produzione lo fa Cloudflare, che compila e pubblica la repo a ogni push su main
# (Workers & Pages > terminalinobru > Settings > Build, vedi docs/RUNBOOK.md sezione 4).
# Questo workflow resta come via di riserva, solo manuale: richiede i secret
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nel repository.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-produzione
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Applica le migrazioni D1 di produzione
        run: pnpm --filter bridge exec wrangler d1 migrations apply DB --remote --env produzione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy su Cloudflare
        run: pnpm --filter bridge exec wrangler deploy --env produzione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
